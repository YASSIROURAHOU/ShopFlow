version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: shopflow-db
    environment:
      POSTGRES_DB: shopflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./api
    container_name: shopflow-api
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/shopflow_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
    ports:
      - "8081:8081"

  client:
    build: ./client
    container_name: shopflow-client
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  pgdata: